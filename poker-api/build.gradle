import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'java'
}

group = 'net.bitbucketlist'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)

    constraints {
        // Spring Boot 4.1.1's BOM still manages Tomcat 11.0.24; pin forward to 11.0.25,
        // which fixes GHSA-h3x4-894j-xpx5, GHSA-9xv2-5v5q-p794 and GHSA-gcx9-497g-6cp6.
        implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'
        implementation 'org.apache.tomcat.embed:tomcat-embed-el:11.0.25'
        implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.25'
    }

    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/integration/**'
    jvmArgs '-XX:+EnableDynamicAgentLoading'   // silence Mockito dynamic-agent warning on JDK 21+
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    // Gradle 8+ removed the old convention that pointed bare Test tasks at the test source set — set explicitly:
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/integration/**'
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}
